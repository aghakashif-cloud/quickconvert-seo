<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">2-Second Test: Digital Text PDF vs Scanned Image PDF</title>
  <desc id="desc">Visual test showing how dragging a cursor across a Digital Text PDF highlights individual words for clean DOCX conversion, whereas a Scanned Image PDF highlights the entire page as one flat photo requiring OCR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">The 2-Second Highlight Test: Digital PDF vs. Scanned Image PDF</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Drag your mouse across one line before converting so you know immediately whether text will extract cleanly</text>

  <!-- Left: Digital PDF -->
  <rect x="28" y="76" width="362" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="44" y="92" width="154" height="22" rx="11" fill="#064e3b"/>
  <text x="121" y="107" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✓ DIGITAL TEXT PDF</text>
  <rect x="44" y="124" width="330" height="44" rx="6" fill="#1e293b"/>
  <rect x="56" y="134" width="166" height="18" rx="3" fill="#0284c7" opacity="0.55"/>
  <text x="60" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">Words highlight one by one cleanly.</text>
  <text x="44" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Exported from Word, Docs, or Canva</text>
  <text x="44" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">→ Converts cleanly to DOCX, XLSX &amp; TXT</text>

  <!-- Right: Scanned PDF -->
  <rect x="410" y="76" width="362" height="150" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="426" y="92" width="164" height="22" rx="11" fill="#451a03"/>
  <text x="508" y="107" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">! SCANNED IMAGE PDF</text>
  <rect x="426" y="124" width="330" height="44" rx="6" fill="#1d4ed8" opacity="0.32" stroke="#60a5fa" stroke-width="1"/>
  <text x="591" y="150" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="11.5">[ Entire page selects as 1 flat photo ]</text>
  <text x="426" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Created by photographing paper pages</text>
  <text x="426" y="210" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">→ Needs OCR before text extraction</text>
</svg>
