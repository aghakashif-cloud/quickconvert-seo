<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Progressive Income Tax Slab Worked Example: 200,000 PKR Monthly Salary Results in 9.58% Effective Rate">
  <rect width="800" height="330" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">HOW PROGRESSIVE TAX SLABS ACTUALLY WORK</text>
  <text x="36" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">Worked Example: 200,000 PKR/mo (2.4M/yr) = 9.58% Effective Tax</text>

  <!-- 4 Slab Bars -->
  <rect x="36" y="96" width="168" height="122" rx="14" fill="#111827" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="52" y="122" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SLAB 1: 0%</text>
  <text x="52" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">0 – 600k</text>
  <text x="52" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Taxable: 600k</text>
  <text x="52" y="198" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tax: 0 PKR</text>

  <rect x="220" y="96" width="168" height="122" rx="14" fill="#111827" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="236" y="122" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SLAB 2: 5%</text>
  <text x="236" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">600k – 1.2M</text>
  <text x="236" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Taxable: 600k</text>
  <text x="236" y="198" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tax: 30,000</text>

  <rect x="404" y="96" width="168" height="122" rx="14" fill="#111827" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="420" y="122" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SLAB 3: 15%</text>
  <text x="420" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">1.2M – 2.2M</text>
  <text x="420" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Taxable: 1.0M</text>
  <text x="420" y="198" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tax: 150,000</text>

  <rect x="588" y="96" width="176" height="122" rx="14" fill="#111827" stroke="#f43f5e" stroke-opacity="0.5"/>
  <text x="604" y="122" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SLAB 4: 25%</text>
  <text x="604" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">2.2M – 2.4M</text>
  <text x="604" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Taxable: 200k</text>
  <text x="604" y="198" fill="#fb7185" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tax: 50,000</text>

  <!-- Summary Banner -->
  <rect x="36" y="238" width="728" height="62" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="264" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Total Annual Tax: 230,000 PKR (19,167/mo)</text>
  <text x="58" y="286" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Monthly Take-Home: ~180,833 PKR   •   Effective Rate: 9.58% (Top Marginal Slab: 25%)</text>
</svg>
