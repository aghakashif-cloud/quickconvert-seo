<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Video to GIF File Size Benchmark: 28.4MB Unoptimized vs 2.1MB Lanczos Optimized</title>
  <desc id="desc">Benchmark chart comparing a 6-second 1080p MP4 screen recording exported as a 28.4MB 1080px 30 FPS GIF versus a crisp 2.1MB 480px 12 FPS Lanczos GIF created locally via FFmpeg WebAssembly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="badBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="goodBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Real GIF Benchmark: 6-Sec 1080p Screen Recording (2.9 MB MP4)</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Why width and frame rate matter: smart Lanczos scaling cuts GIF weight by 92% while keeping buttons &amp; cursors sharp</text>

  <!-- Unoptimized -->
  <rect x="30" y="78" width="740" height="80" rx="12" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.4"/>
  <text x="48" y="102" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Unoptimized GIF (1080px Wide • 30 FPS)</text>
  <text x="588" y="102" fill="#f87171" font-family="ui-monospace, monospace" font-size="14" font-weight="700">28.4 MB (Bloated)</text>
  <rect x="48" y="118" width="700" height="24" rx="12" fill="#1e293b"/>
  <rect x="48" y="118" width="680" height="24" rx="12" fill="url(#badBar)"/>
  <text x="66" y="134" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✕ Fails Discord 10MB cap • Freezes mobile email newsletters • Slow blog load</text>

  <!-- Optimized -->
  <rect x="30" y="172" width="740" height="100" rx="12" fill="#0f172a" stroke="#065f46" stroke-width="1.6"/>
  <text x="48" y="196" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">QuickConvert Smart GIF (480px Wide • 12 FPS • Lanczos Filter)</text>
  <text x="568" y="196" fill="#34d399" font-family="ui-monospace, monospace" font-size="14" font-weight="700">2.1 MB (92% Smaller!)</text>
  <rect x="48" y="212" width="700" height="24" rx="12" fill="#1e293b"/>
  <rect x="48" y="212" width="58" height="24" rx="12" fill="url(#goodBar)"/>
  <text x="118" y="228" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Smooth auto-loop • Crisp UI labels • Instant load in Gmail, Slack, GitHub &amp; Discord</text>

  <text x="48" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Processed 100% locally inside your browser with FFmpeg WebAssembly — zero uploads, zero watermarks.</text>
</svg>
