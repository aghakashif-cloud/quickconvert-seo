<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Weekly YouTuber Time Savings: Manual Packaging vs 2026 AI Creator Stack</title>
  <desc id="desc">Benchmark chart comparing 5.5 hours per video spent manually researching keywords, writing descriptions, transcribing, designing thumbnails, and slicing Shorts versus 35 minutes using QuickConvert's 5-tool AI workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="manualBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aiBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Real Creator Time Audit: Post-Edit Packaging for One 12-Min Video</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Combining AI transcription, SEO generation, HD thumbnails &amp; Shorts clipping saves ~5 hours every single upload</text>

  <!-- Manual Workflow -->
  <rect x="30" y="78" width="740" height="68" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.4"/>
  <text x="48" y="101" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Manual Packaging (SEO + Captions + Thumbnail + 3 Shorts)</text>
  <text x="606" y="101" fill="#f87171" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">~5.5 Hours / Video</text>
  <rect x="48" y="114" width="700" height="20" rx="10" fill="#1e293b"/>
  <rect x="48" y="114" width="664" height="20" rx="10" fill="url(#manualBar)"/>
  <text x="64" y="128" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Keyword guesswork (45m) + Captions (90m) + Thumbnail (60m) + Slicing Shorts (135m)</text>

  <!-- AI Workflow -->
  <rect x="30" y="160" width="740" height="68" rx="10" fill="#0f172a" stroke="#065f46" stroke-width="1.6"/>
  <text x="48" y="183" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2026 QuickConvert 5-Tool AI Stack + Human Creative Polish</text>
  <text x="588" y="183" fill="#34d399" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">~35 Minutes (89% Faster!)</text>
  <rect x="48" y="196" width="700" height="20" rx="10" fill="#1e293b"/>
  <rect x="48" y="196" width="74" height="20" rx="10" fill="url(#aiBar)"/>
  <text x="134" y="210" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ More hours left for scripting, filming &amp; storytelling — zero monthly fees</text>
</svg>
