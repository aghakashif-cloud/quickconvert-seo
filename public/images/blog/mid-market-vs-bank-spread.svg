<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Mid-Market Exchange Rate vs Typical Bank Markup Comparison on a $1,000 Transfer">
  <rect width="800" height="270" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">WHY RATE CHECKING MATTERS ($1,000 EXAMPLE)</text>
  <text x="36" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Mid-Market Reference Rate vs. Retail Bank &amp; Airport Spreads</text>

  <!-- Bar 1 -->
  <text x="36" y="114" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Live Mid-Market Rate (0% Markup)</text>
  <rect x="36" y="124" width="660" height="24" rx="12" fill="#10b981"/>
  <text x="710" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">$1,000</text>

  <!-- Bar 2 -->
  <text x="36" y="176" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Typical Bank / Remittance App (~3.5% Spread)</text>
  <rect x="36" y="186" width="625" height="24" rx="12" fill="#f59e0b"/>
  <text x="676" y="203" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">$965 (-$35)</text>

  <!-- Bar 3 -->
  <text x="36" y="236" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Airport Kiosk / Dynamic Currency Conversion (~8%–10% Spread)</text>
  <rect x="36" y="244" width="560" height="16" rx="8" fill="#f43f5e"/>
  <text x="612" y="257" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="800">~$910 (-$90 lost)</text>
</svg>
