<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="4-Week Free Transcription Learning Roadmap for Beginners">
  <rect width="800" height="300" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">ZERO-COST BEGINNER ROADMAP</text>
  <text x="36" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">4-Week Free Transcription Practice Plan</text>

  <line x1="70" y1="130" x2="730" y2="130" stroke="#334155" stroke-width="3"/>

  <!-- Week 1 -->
  <circle cx="115" cy="130" r="16" fill="#06b6d4"/>
  <text x="115" y="135" text-anchor="middle" fill="#020617" font-family="system-ui, sans-serif" font-size="13" font-weight="800">W1</text>
  <rect x="36" y="160" width="160" height="106" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="50" y="186" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Style Rules</text>
  <text x="50" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Learn Clean vs.</text>
  <text x="50" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Full Verbatim</text>
  <text x="50" y="248" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cut filler words</text>

  <!-- Week 2 -->
  <circle cx="305" cy="130" r="16" fill="#6366f1"/>
  <text x="305" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">W2</text>
  <rect x="224" y="160" width="160" height="106" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="238" y="186" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3-Min Drills</text>
  <text x="238" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Clear daily clips</text>
  <text x="238" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Hit 98% spelling</text>
  <text x="238" y="248" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Accuracy &gt; speed</text>

  <!-- Week 3 -->
  <circle cx="495" cy="130" r="16" fill="#a855f7"/>
  <text x="495" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">W3</text>
  <rect x="412" y="160" width="160" height="106" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="426" y="186" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Multi-Speaker</text>
  <text x="426" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Speaker labels &amp;</text>
  <text x="426" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">[00:02:15] tags</text>
  <text x="426" y="248" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Podcast interviews</text>

  <!-- Week 4 -->
  <circle cx="685" cy="130" r="16" fill="#10b981"/>
  <text x="685" y="135" text-anchor="middle" fill="#020617" font-family="system-ui, sans-serif" font-size="13" font-weight="800">W4</text>
  <rect x="600" y="160" width="164" height="106" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="614" y="186" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AI Post-Edit</text>
  <text x="614" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Grade with local</text>
  <text x="614" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Whisper AI tool</text>
  <text x="614" y="248" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">4:1 target pace</text>
