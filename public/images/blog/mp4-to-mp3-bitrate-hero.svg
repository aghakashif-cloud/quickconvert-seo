<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">MP4 to MP3 Bitrate Benchmark: 480MB Video Shrunk to 28.8MB, 43.2MB, or 72MB MP3</title>
  <desc id="desc">Real file size comparison extracting audio from a 30-minute 480MB 1080p MP4 video locally via FFmpeg WebAssembly at 128 kbps (28.8MB), 192 kbps (43.2MB), and 320 kbps (72.0MB).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="b128" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="b192" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="b320" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">MP4 to MP3 Bitrate Test: 30-Min 480 MB Interview Video</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Extracted 100% locally in browser with FFmpeg WebAssembly — zero 480 MB uploads, instant start</text>

  <!-- 128 kbps -->
  <rect x="30" y="78" width="740" height="58" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="48" y="100" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">128 kbps MP3 — Compact Speech &amp; Lectures</text>
  <text x="580" y="100" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">28.8 MB (94% Smaller)</text>
  <rect x="48" y="110" width="700" height="14" rx="7" fill="#1e293b"/>
  <rect x="48" y="110" width="90" height="14" rx="7" fill="url(#b128)"/>

  <!-- 192 kbps -->
  <rect x="30" y="148" width="740" height="58" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="48" y="170" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">192 kbps MP3 — Everyday Podcast &amp; YouTube Sweet Spot ★</text>
  <text x="580" y="170" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">43.2 MB (91% Smaller)</text>
  <rect x="48" y="180" width="700" height="14" rx="7" fill="#1e293b"/>
  <rect x="48" y="180" width="142" height="14" rx="7" fill="url(#b192)"/>

  <!-- 320 kbps -->
  <rect x="30" y="218" width="740" height="58" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.3"/>
  <text x="48" y="240" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">320 kbps MP3 — Studio Music &amp; Post-Editing Fidelity</text>
  <text x="580" y="240" fill="#c084fc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">72.0 MB (85% Smaller)</text>
  <rect x="48" y="250" width="700" height="14" rx="7" fill="#1e293b"/>
  <rect x="48" y="250" width="236" height="14" rx="7" fill="url(#b320)"/>
</svg>
