<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Three Essential Everyday Percentage Formulas With Worked Examples">
  <rect width="800" height="300" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">THE 3 EVERYDAY PERCENTAGE FORMULAS</text>
  <text x="36" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">Visual Cheat Sheet for Discounts, Scores &amp; Growth</text>

  <rect x="36" y="96" width="232" height="168" rx="14" fill="#111827" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="54" y="124" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">1. WHAT IS X% OF Y?</text>
  <text x="54" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">(X ÷ 100) × Y</text>
  <text x="54" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Discounts, tax &amp; tips</text>
  <rect x="52" y="204" width="200" height="42" rx="10" fill="#0f172a"/>
  <text x="64" y="229" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">25% of $120 = $30 off</text>

  <rect x="284" y="96" width="232" height="168" rx="14" fill="#111827" stroke="#06b6d4" stroke-opacity="0.5"/>
  <text x="302" y="124" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="800">2. X IS WHAT % OF Y?</text>
  <text x="302" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">(X ÷ Y) × 100</text>
  <text x="302" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Exam scores &amp; budgets</text>
  <rect x="300" y="204" width="200" height="42" rx="10" fill="#0f172a"/>
  <text x="312" y="229" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$1,120 / $3,200 = 35%</text>

  <rect x="532" y="96" width="232" height="168" rx="14" fill="#111827" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="550" y="124" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">3. % CHANGE (OLD → NEW)</text>
  <text x="550" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">((New − Old) ÷ Old) × 100</text>
  <text x="550" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Raises &amp; price drops</text>
  <rect x="548" y="204" width="200" height="42" rx="10" fill="#0f172a"/>
  <text x="560" y="229" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$40 → $50 = +25% raise</text>
</svg>
