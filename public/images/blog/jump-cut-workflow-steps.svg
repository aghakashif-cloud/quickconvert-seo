<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">3-Stage Client-Side Smart Jump-Cut Editing Pipeline</title>
  <desc id="desc">Three-step browser editing pipeline: Step 1 Transcribing Audio with FFmpeg WASM and Whisper AI, Step 2 Analyzing for Cuts with Gemini AI plus acoustic silence detection, and Step 3 Rendering Final Smooth Video locally via FFmpeg -ss/-to and concat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Inside the 3-Stage Browser Jump-Cut Engine (100% Free)</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Your raw video stays strictly on your own device — only the lightweight text transcript is analyzed for cuts</text>

  <!-- Stage 1 -->
  <rect x="28" y="78" width="222" height="146" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="44" y="94" width="114" height="22" rx="11" fill="#0c4a6e"/>
  <text x="101" y="109" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STAGE 1: AUDIO</text>
  <text x="44" y="138" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Transcribing Audio</text>
  <text x="44" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">FFmpeg extracts 16kHz</text>
  <text x="44" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">PCM &amp; Whisper builds</text>
  <text x="44" y="194" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">timestamped chunks.</text>

  <path d="M256 151 L280 151" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="280,145 290,151 280,157" fill="#38bdf8"/>

  <!-- Stage 2 -->
  <rect x="294" y="78" width="222" height="146" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="310" y="94" width="118" height="22" rx="11" fill="#3b0764"/>
  <text x="369" y="109" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STAGE 2: AI CUTS</text>
  <text x="310" y="138" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Analyzing for Cuts</text>
  <text x="310" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Gemini flags silences,</text>
  <text x="310" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">long pauses &amp; fillers</text>
  <text x="310" y="194" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5">highlighted in red.</text>

  <path d="M522 151 L546 151" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="546,145 556,151 546,157" fill="#34d399"/>

  <!-- Stage 3 -->
  <rect x="560" y="78" width="212" height="146" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.6"/>
  <rect x="576" y="94" width="122" height="22" rx="11" fill="#064e3b"/>
  <text x="637" y="109" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STAGE 3: EXPORT</text>
  <text x="576" y="138" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Rendering Final Video</text>
  <text x="576" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">FFmpeg -ss/-to slices</text>
  <text x="576" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">good segments &amp; merges</text>
  <text x="576" y="194" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5">1 smooth MP4 locally.</text>
</svg>
