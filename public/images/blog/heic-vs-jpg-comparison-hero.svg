<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">iPhone HEIC vs Universal JPG Comparison and Local Browser Conversion</title>
  <desc id="desc">Side-by-side comparison showing iPhone HEIC photos at 1.8MB blocked on Windows and upload portals versus locally converted 85 to 92 percent quality JPG files that open everywhere with zero uploads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="heicBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="jpgBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">iPhone .HEIC vs. Universal .JPG: Why Convert Locally?</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Keep HEIC for saving iPhone storage — convert to 85–92% JPG locally whenever sharing to Windows, email, or web portals</text>

  <!-- Left Card: HEIC -->
  <rect x="28" y="78" width="330" height="196" rx="12" fill="#0f172a" stroke="#92400e" stroke-width="1.5"/>
  <rect x="28" y="78" width="330" height="5" rx="2.5" fill="url(#heicBar)"/>
  <rect x="44" y="96" width="96" height="22" rx="11" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="92" y="111" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11" font-weight="700">.HEIC RAW</text>
  <text x="152" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Apple Default Format</text>

  <rect x="44" y="130" width="298" height="34" rx="8" fill="#1e293b"/>
  <text x="58" y="151" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Test Photo: 1.8 MB (40–50% smaller)</text>

  <text x="44" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">✓ Great for saving iPhone storage</text>
  <text x="44" y="208" fill="#f87171" font-family="system-ui, sans-serif" font-size="12">✕ Windows asks for paid HEVC codec</text>
  <text x="44" y="230" fill="#f87171" font-family="system-ui, sans-serif" font-size="12">✕ Rejected by job, bank &amp; visa forms</text>
  <text x="44" y="256" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hidden EXIF GPS location data inside</text>

  <!-- Center Arrow -->
  <rect x="366" y="148" width="68" height="52" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="170" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LOCAL</text>
  <text x="400" y="186" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">→→</text>

  <!-- Right Card: JPG -->
  <rect x="442" y="78" width="330" height="196" rx="12" fill="#0f172a" stroke="#065f46" stroke-width="1.5"/>
  <rect x="442" y="78" width="330" height="5" rx="2.5" fill="url(#jpgBar)"/>
  <rect x="458" y="96" width="110" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="513" y="111" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">.JPG UNIVERSAL</text>
  <text x="578" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Opens Everywhere</text>

  <rect x="458" y="130" width="298" height="34" rx="8" fill="#1e293b"/>
  <text x="472" y="151" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">85–92% Quality: Visually Identical</text>

  <text x="458" y="186" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Opens natively on Windows 10 &amp; 11</text>
  <text x="458" y="208" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Accepted by 100% of web portals</text>
  <text x="458" y="230" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Batch-convert folders in seconds</text>
  <text x="458" y="256" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🔒 Zero cloud uploads — stays in RAM</text>
</svg>
