<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">100% Private Browser-Based PDF to Audiobook Workflow</title>
  <desc id="desc">Four-step local PDF to Audiobook workflow: drop any text-based PDF, extract text locally with PDF.js, trim headers and citations in the editor, and listen aloud via browser Web Speech neural voices at 0.5x to 2.0x speed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="voiceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">How Private PDF-to-Audiobook Narration Works Locally</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Turn textbooks, research papers, and contracts into spoken audio inside your tab — zero uploads, zero character caps</text>

  <!-- Step 1 -->
  <rect x="28" y="84" width="166" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="110" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">1. DROP ANY PDF</text>
  <rect x="66" y="128" width="90" height="62" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
  <text x="111" y="156" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Report.pdf</text>
  <text x="111" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">50-Page Ebook</text>
  <text x="111" y="218" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Textbooks, essays,</text>
  <text x="111" y="236" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">&amp; private contracts</text>

  <!-- Arrow 1 -->
  <path d="M198 174 L220 174" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="220,168 230,174 220,180" fill="#38bdf8"/>

  <!-- Step 2 -->
  <rect x="234" y="84" width="166" height="180" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="250" y="110" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">2. LOCAL PDF.JS</text>
  <text x="250" y="138" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">In-RAM Extraction</text>
  <text x="250" y="162" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Parses all pages right</text>
  <text x="250" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">inside browser RAM.</text>
  <rect x="250" y="202" width="134" height="44" rx="8" fill="#1e293b"/>
  <text x="317" y="220" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Shows Word Count</text>
  <text x="317" y="236" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&amp; Listen Duration</text>

  <!-- Arrow 2 -->
  <path d="M404 174 L426 174" stroke="#818cf8" stroke-width="2.5"/>
  <polygon points="426,168 436,174 426,180" fill="#818cf8"/>

  <!-- Step 3 -->
  <rect x="440" y="84" width="166" height="180" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="456" y="110" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">3. CLEAN EDITOR</text>
  <text x="456" y="138" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Trim Clutter Fast</text>
  <text x="456" y="162" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Delete page headers,</text>
  <text x="456" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">TOC &amp; citation URLs</text>
  <text x="456" y="198" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">in 30 seconds before</text>
  <text x="456" y="216" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">pressing Play.</text>
  <text x="456" y="246" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Zero awkward URLs</text>

  <!-- Arrow 3 -->
  <path d="M610 174 L632 174" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="632,168 642,174 632,180" fill="#34d399"/>

  <!-- Step 4 -->
  <rect x="646" y="84" width="128" height="180" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.6"/>
  <rect x="646" y="84" width="128" height="5" rx="2.5" fill="url(#voiceGrad)"/>
  <text x="660" y="110" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">4. LISTEN LIVE</text>
  <rect x="658" y="128" width="104" height="58" rx="8" fill="#064e3b"/>
  <text x="710" y="152" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Neural Voices</text>
  <text x="710" y="170" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">0.5x — 2.0x</text>
  <text x="710" y="212" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Pause • Resume</text>
  <text x="710" y="230" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Multi-Language</text>
  <text x="710" y="248" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">0 Bytes Uploaded</text>
</svg>
