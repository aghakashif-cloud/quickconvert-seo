  <rect x="552" y="96" width="212" height="126" rx="14" fill="#111827" stroke="#a855f7" stroke-opacity="0.5"/>
  <text x="570" y="124" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">3. PROMOTE WITH GIF</text>
  <text x="570" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">5s Teaser Loop (12 FPS)</text>
