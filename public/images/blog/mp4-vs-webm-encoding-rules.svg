<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">MP4 H.264 vs WebM Container Guide and Golden Video Compression Rule</title>
  <desc id="desc">Visual comparison of MP4 H.264 for universal playback versus WebM for lightweight website banners, paired with the golden rule to lower resolution before starving bitrate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">MP4 (H.264) vs. WebM &amp; The Golden Compression Rule</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Avoid blurry artifacts: always start from your original file and lower resolution before choking bitrate</text>

  <!-- MP4 Card -->
  <rect x="28" y="76" width="236" height="150" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="44" y="92" width="112" height="22" rx="11" fill="#0c4a6e"/>
  <text x="100" y="107" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MP4 (H.264)</text>
  <text x="44" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Universal Sharing</text>
  <text x="44" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Clients, YouTube &amp; TVs</text>
  <text x="44" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• iPhone, Android, Win, Mac</text>
  <text x="44" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Safest default choice</text>

  <!-- WebM Card -->
  <rect x="282" y="76" width="236" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="298" y="92" width="102" height="22" rx="11" fill="#064e3b"/>
  <text x="349" y="107" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">.WEBM WEB</text>
  <text x="298" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Website Hero Loops</text>
  <text x="298" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 15–20% lighter than MP4</text>
  <text x="298" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Faster Core Web Vitals</text>
  <text x="298" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Great for landing pages</text>

  <!-- Golden Rule Card -->
  <rect x="536" y="76" width="236" height="150" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="552" y="92" width="118" height="22" rx="11" fill="#451a03"/>
  <text x="611" y="107" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">★ GOLDEN RULE</text>
  <text x="552" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Scale Before Starving</text>
  <text x="552" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Clean 720p @ 2 Mbps</text>
  <text x="552" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">beats blocky 4K @ 2 Mbps.</text>
  <text x="552" y="210" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Never re-compress twice</text>
</svg>
