<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 265" width="800" height="265" role="img" aria-label="Country-Wise Average Annual Property Tax Benchmarks for Pakistan, India, US, UK, and UAE">
  <rect width="800" height="265" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">PROPERTY TAX NATIONAL AVERAGE BENCHMARKS</text>
  <text x="36" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Estimated Annual Property Tax Rates Across 5 Major Countries</text>

  <rect x="36" y="96" width="134" height="132" rx="14" fill="#111827" stroke="#10b981" stroke-opacity="0.45"/>
  <text x="50" y="124" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Pakistan</text>
  <text x="50" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">~1–3%</text>
  <text x="50" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Default: 2.0%</text>
  <text x="50" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Varies by province</text>

  <rect x="184" y="96" width="134" height="132" rx="14" fill="#111827" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text x="198" y="124" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="800">India</text>
  <text x="198" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">~1–2%</text>
  <text x="198" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Default: 1.5%</text>
  <text x="198" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Municipal corp.</text>

  <rect x="332" y="96" width="134" height="132" rx="14" fill="#111827" stroke="#6366f1" stroke-opacity="0.45"/>
  <text x="346" y="124" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="800">United States</text>
  <text x="346" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">~1.1%</text>
  <text x="346" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0.3%–2.2% range</text>
  <text x="346" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">County &amp; state</text>

  <rect x="480" y="96" width="134" height="132" rx="14" fill="#111827" stroke="#a855f7" stroke-opacity="0.45"/>
  <text x="494" y="124" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="13" font-weight="800">UK</text>
  <text x="494" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">~0.75%</text>
  <text x="494" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Council Tax est.</text>
  <text x="494" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Bands A–H</text>

  <rect x="628" y="96" width="136" height="132" rx="14" fill="#111827" stroke="#06b6d4" stroke-opacity="0.45"/>
  <text x="642" y="124" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="800">UAE</text>
  <text x="642" y="156" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="800">0%</text>
  <text x="642" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Annual residential</text>
  <text x="642" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">4% one-time DLD</text>
</svg>
