<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">48-Hour Post-Publish YouTube CTR and Retention Optimization Loop</title>
  <desc id="desc">Four-step growth workflow: publish with AI packaging, check YouTube Studio CTR at 24 to 48 hours, swap to an alternate hook title if CTR is below 4 percent, and pay off the title promise within the first 30 seconds to protect retention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">The 48-Hour CTR Upgrade Loop (Without Falling Into Clickbait)</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Target 4%–10% CTR while keeping Average View Duration high by paying off your title promise in the first 30 seconds</text>

  <!-- Step 1 -->
  <rect x="28" y="78" width="168" height="148" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="44" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. PUBLISH</text>
  <text x="44" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Launch Title #1</text>
  <text x="44" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Pair your main AI</text>
  <text x="44" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">title with 2–5 word</text>
  <text x="44" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">thumbnail text.</text>
  <text x="44" y="212" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Save 4 backup hooks</text>

  <path d="M200 152 L214 152" stroke="#64748b" stroke-width="2"/>
  <polygon points="214,147 222,152 214,157" fill="#64748b"/>

  <!-- Step 2 -->
  <rect x="224" y="78" width="168" height="148" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="240" y="104" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. CHECK 24–48H</text>
  <text x="240" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Read Studio CTR</text>
  <text x="240" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">CTR below 4% yet</text>
  <text x="240" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">watch time looks</text>
  <text x="240" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">strong? Time to test!</text>
  <text x="240" y="212" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Great content, weak door</text>

  <path d="M396 152 L410 152" stroke="#64748b" stroke-width="2"/>
  <polygon points="410,147 418,152 410,157" fill="#64748b"/>

  <!-- Step 3 -->
  <rect x="420" y="78" width="168" height="148" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.4"/>
  <text x="436" y="104" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. SWAP HOOK</text>
  <text x="436" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Try Alt AI Angle</text>
  <text x="436" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Swap in a curiosity,</text>
  <text x="436" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">listicle, or contrarian</text>
  <text x="436" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">title and track 3 days.</text>
  <text x="436" y="212" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Zero re-uploading</text>

  <path d="M592 152 L606 152" stroke="#10b981" stroke-width="2"/>
  <polygon points="606,147 614,152 606,157" fill="#10b981"/>

  <!-- Step 4 -->
  <rect x="616" y="78" width="156" height="148" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
  <text x="632" y="104" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">4. DELIVER FAST</text>
  <text x="632" y="128" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Honest 30s Payoff</text>
  <text x="632" y="152" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11.5">Fulfill the title fast</text>
  <text x="632" y="169" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11.5">so CTR + Retention</text>
  <text x="632" y="186" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11.5">climb together.</text>
  <text x="632" y="212" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">No fake clickbait</text>
</svg>
