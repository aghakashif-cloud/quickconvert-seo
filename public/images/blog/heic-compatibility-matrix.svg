<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">HEIC vs JPG Cross-Platform Compatibility Matrix</title>
  <desc id="desc">Compatibility matrix showing HEIC works natively on iPhone and macOS but fails or requires paid codecs on Windows PCs, older Android devices, and online portals, whereas locally converted JPG works everywhere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">HEIC vs. JPG Compatibility Across Everyday Devices &amp; Portals</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Converting locally in QuickConvert fixes every red X below without uploading private camera rolls</text>

  <!-- Table Header -->
  <rect x="28" y="74" width="744" height="30" rx="8" fill="#1e293b"/>
  <text x="48" y="94" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PLATFORM / DESTINATION</text>
  <text x="360" y="94" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RAW .HEIC FILE</text>
  <text x="580" y="94" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CONVERTED .JPG</text>

  <!-- Row 1 -->
  <text x="48" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">iPhone, iPad &amp; macOS</text>
  <text x="360" y="128" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ Native Support</text>
  <text x="580" y="128" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ Native Support</text>
  <line x1="28" y1="140" x2="772" y2="140" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="48" y="162" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Windows 10 / 11 PC</text>
  <text x="360" y="162" fill="#f87171" font-family="system-ui, sans-serif" font-size="12">✕ Needs Paid HEVC Codec</text>
  <text x="580" y="162" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ Opens Instantly</text>
  <line x1="28" y1="174" x2="772" y2="174" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="48" y="196" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Android Apps &amp; Older Phones</text>
  <text x="360" y="196" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12">! Inconsistent Previews</text>
  <text x="580" y="196" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ 100% Universal</text>
  <line x1="28" y1="208" x2="772" y2="208" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="48" y="230" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Job, Visa, Bank &amp; Print Portals</text>
  <text x="360" y="230" fill="#f87171" font-family="system-ui, sans-serif" font-size="12">✕ Often Rejected on Upload</text>
  <text x="580" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ Accepted Everywhere</text>
</svg>
