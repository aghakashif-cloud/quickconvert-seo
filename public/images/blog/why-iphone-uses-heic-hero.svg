<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Why Apple iPhones Save Photos as HEIC Instead of JPG</title>
  <desc id="desc">Visual explanation of Apple HEIC High Efficiency Image Container using H.265 compression, 16-bit color depth, and Live Photo metadata to cut storage space roughly in half compared to legacy 8-bit JPG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Why Is Your iPhone Saving .HEIC Files Instead of .JPG?</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Apple adopted HEIC (High Efficiency Image Container) in iOS 11 to double iPhone photo storage without losing detail</text>

  <!-- Storage Visual Comparison -->
  <rect x="28" y="78" width="360" height="196" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="28" y="78" width="360" height="5" rx="2.5" fill="url(#appleGrad)"/>
  <text x="46" y="106" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">INSIDE AN IPHONE .HEIC CONTAINER</text>

  <text x="46" y="134" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1,000 iPhone Photos in JPG (~3.8 GB):</text>
  <rect x="46" y="142" width="320" height="18" rx="9" fill="#1e293b"/>
  <rect x="46" y="142" width="308" height="18" rx="9" fill="#f59e0b"/>
  <text x="60" y="155" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">3.8 GB — Legacy 8-bit 1992 compression</text>

  <text x="46" y="184" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1,000 iPhone Photos in HEIC (~1.9 GB):</text>
  <rect x="46" y="192" width="320" height="18" rx="9" fill="#1e293b"/>
  <rect x="46" y="192" width="154" height="18" rx="9" fill="#10b981"/>
  <text x="208" y="205" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">50% Space Saved!</text>

  <text x="46" y="236" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">✓ 16-bit HDR color + Portrait depth map</text>
  <text x="46" y="256" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">✓ Bundles Live Photos &amp; non-destructive edits</text>

  <!-- Right Panel: Why It Breaks Outside Apple -->
  <rect x="410" y="78" width="362" height="196" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="428" y="106" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">WHY WINDOWS &amp; ANDROID STRUGGLE</text>

  <rect x="428" y="122" width="326" height="42" rx="8" fill="#1e293b"/>
  <text x="442" y="140" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. Patented HEVC (H.265) Licensing</text>
  <text x="442" y="156" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Windows 10/11 omits the paid codec by default.</text>

  <rect x="428" y="172" width="326" height="42" rx="8" fill="#1e293b"/>
  <text x="442" y="190" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. Older Android &amp; Web Forms Reject .HEIC</text>
  <text x="442" y="206" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Bank KYC, job portals &amp; print shops demand .JPG.</text>

  <rect x="428" y="222" width="326" height="38" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="591" y="245" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Fix: Convert Locally to JPG in 2 Seconds (Free)</text>
</svg>
