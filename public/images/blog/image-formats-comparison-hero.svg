<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">PNG vs JPG vs WebP vs AVIF Real File Size Benchmark on a 1920x1080 Photo</title>
  <desc id="desc">Visual benchmark comparing one 1920x1080 photograph exported at 85 percent visual quality across all four formats: PNG lossless 2.84MB, JPG 342KB (88 percent smaller), WebP 215KB, and AVIF 148KB (94 percent smaller than PNG).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pngB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="jpgB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="webpB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="avifB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Real Test: One 1920×1080 Photo Across PNG, JPG, WebP &amp; AVIF</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Exported at 85% high visual quality locally via HTML5 Canvas — switching from PNG cuts weight up to 94%</text>

  <!-- PNG -->
  <text x="34" y="96" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">PNG (Lossless)</text>
  <text x="586" y="96" fill="#f87171" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">2,840 KB (2.84 MB)</text>
  <rect x="34" y="104" width="732" height="18" rx="9" fill="#1e293b"/>
  <rect x="34" y="104" width="710" height="18" rx="9" fill="url(#pngB)"/>
  <text x="48" y="117" fill="#fff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Best for logos, UI screenshots &amp; transparency — avoid for large photos</text>

  <!-- JPG -->
  <text x="34" y="148" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">JPG (85% Quality)</text>
  <text x="586" y="148" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">342 KB (-88% vs PNG)</text>
  <rect x="34" y="156" width="732" height="18" rx="9" fill="#1e293b"/>
  <rect x="34" y="156" width="128" height="18" rx="9" fill="url(#jpgB)"/>
  <text x="172" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Universal support on forms, email &amp; print (no transparency)</text>

  <!-- WebP -->
  <text x="34" y="200" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">WebP (85% Quality)</text>
  <text x="586" y="200" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">215 KB (-37% vs JPG)</text>
  <rect x="34" y="208" width="732" height="18" rx="9" fill="#1e293b"/>
  <rect x="34" y="208" width="84" height="18" rx="9" fill="url(#webpB)"/>
  <text x="128" y="221" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5">★ Best all-around web default — supports transparency &amp; photos</text>

  <!-- AVIF -->
  <text x="34" y="252" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">AVIF (85% Quality)</text>
  <text x="586" y="252" fill="#34d399" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">148 KB (-94% vs PNG!)</text>
  <rect x="34" y="260" width="732" height="18" rx="9" fill="#1e293b"/>
  <rect x="34" y="260" width="58" height="18" rx="9" fill="url(#avifB)"/>
  <text x="102" y="273" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Maximum next-gen compression for fast hero banners &amp; Core Web Vitals</text>
</svg>
