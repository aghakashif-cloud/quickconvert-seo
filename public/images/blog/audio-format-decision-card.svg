<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Audio Extraction Format Chooser: MP3 vs WAV vs Local AI Transcription</title>
  <desc id="desc">Three-card guide matching extracted audio format to your workflow: MP3 for universal playback and podcasts, lossless WAV for Audacity or Premiere Pro mixing, and MP3 fed into QuickConvert AI Transcriber for written study notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Choosing Your Extracted Audio Format: MP3 vs. WAV vs. Notes</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Use Trim Start &amp; Trim End in Advanced settings to pull just one exact quote or song slice without converting the whole video</text>

  <!-- Card 1: MP3 -->
  <rect x="28" y="76" width="236" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="44" y="92" width="128" height="22" rx="11" fill="#064e3b"/>
  <text x="108" y="107" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">.MP3 UNIVERSAL</text>
  <text x="44" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Podcasts &amp; Commutes</text>
  <text x="44" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Plays on every phone &amp; car</text>
  <text x="44" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Spotify / Apple Podcasts</text>
  <text x="44" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Pick 128 or 192 kbps</text>

  <!-- Card 2: WAV -->
  <rect x="282" y="76" width="236" height="150" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="298" y="92" width="128" height="22" rx="11" fill="#0c4a6e"/>
  <text x="362" y="107" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">.WAV LOSSLESS</text>
  <text x="298" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Editing &amp; Mastering</text>
  <text x="298" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Zero compression loss</text>
  <text x="298" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Audacity, Premiere, Logic</text>
  <text x="298" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">~10 MB per minute</text>

  <!-- Card 3: Transcribe -->
  <rect x="536" y="76" width="236" height="150" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="552" y="92" width="140" height="22" rx="11" fill="#3b0764"/>
  <text x="622" y="107" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">NEXT: AI TRANSCRIBE</text>
  <text x="552" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Turn Audio Into Notes</text>
  <text x="552" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Drop fresh MP3 into</text>
  <text x="552" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">  local Whisper AI tool</text>
  <text x="552" y="210" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Searchable .TXT study notes</text>
</svg>
