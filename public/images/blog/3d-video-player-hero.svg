<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="3D Tilt Video Player Interactive Perspective Stage with Mouse Parallax and Mobile Gyroscope">
  <defs>
    <radialGradient id="glow3d" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="330" rx="20" fill="#060913" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="400" cy="185" rx="290" ry="115" fill="url(#glow3d)"/>

  <text x="40" y="42" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">INTERACTIVE CSS 3D PERSPECTIVE CINEMA</text>
  <text x="40" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">Floating 3D Tilt Video Stage (Mouse &amp; Mobile Gyroscope)</text>

  <!-- Tilted 3D Card Mockup -->
  <polygon points="180,115 625,100 645,255 160,270" fill="url(#frame3d)" stroke="#818cf8" stroke-width="2"/>
  <polygon points="184,119 360,113 280,266 164,266" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Play Button Circle -->
  <circle cx="402" cy="182" r="32" fill="#6366f1" fill-opacity="0.9"/>
  <polygon points="393,168 418,182 393,196" fill="#ffffff"/>

  <!-- Badges -->
  <rect x="40" y="282" width="215" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="147" y="301" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">10°–20° X/Y Tilt + 1.05x Scale</text>

  <rect x="275" y="282" width="225" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="387" y="301" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mobile Gyroscope Enabled</text>

  <rect x="520" y="282" width="240" height="30" rx="15" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.5"/>
  <text x="640" y="301" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Record &amp; Share .WebM Clips</text>
</svg>
