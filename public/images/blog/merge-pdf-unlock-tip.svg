<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">3-Step Local Trick to Unlock Password-Protected PDFs Before Merging</title>
  <desc id="desc">Three-step privacy-safe guide showing how to remove read-only encryption from bank statements or payslips locally by opening in your browser, printing to Save as PDF, and merging cleanly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Pro Fix: Merging Password-Protected Bank Statements Safely</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Never upload locked financial PDFs to sketchy "PDF unlocker" websites — clear encryption locally in 15 seconds</text>

  <!-- Step 1 -->
  <rect x="30" y="82" width="222" height="142" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
  <circle cx="56" cy="108" r="14" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="56" y="113" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="80" y="113" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Open Locally</text>
  <text x="46" y="142" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Open the locked PDF directly</text>
  <text x="46" y="160" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">in Chrome, Edge, or Safari and</text>
  <text x="46" y="178" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">type your password once.</text>
  <text x="46" y="206" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Stays 100% on your computer</text>

  <!-- Arrow 1 -->
  <path d="M258 153 L282 153" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="282,147 292,153 282,159" fill="#64748b"/>

  <!-- Step 2 -->
  <rect x="296" y="82" width="222" height="142" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="322" cy="108" r="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="322" y="113" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="346" y="113" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Print → Save as PDF</text>
  <text x="312" y="142" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Press Ctrl+P (or Cmd+P), pick</text>
  <text x="312" y="160" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">"Save as PDF" as destination,</text>
  <text x="312" y="178" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">and save an unlocked copy.</text>
  <text x="312" y="206" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Removes DRM lock cleanly</text>

  <!-- Arrow 2 -->
  <path d="M524 153 L548 153" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="548,147 558,153 548,159" fill="#64748b"/>

  <!-- Step 3 -->
  <rect x="562" y="82" width="208" height="142" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
  <circle cx="588" cy="108" r="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="588" y="113" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="612" y="113" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Merge &amp; Compress</text>
  <text x="578" y="142" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Drop the unlocked PDF into</text>
  <text x="578" y="160" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">QuickConvert Merge PDF and</text>
  <text x="578" y="178" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">combine with your packet.</text>
  <text x="578" y="206" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Zero third-party exposure</text>
</svg>
