<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Smart AI Jump-Cut Editor: Automatically Remove Silences and Filler Words</title>
  <desc id="desc">Timeline visualization comparing a raw talking-head video filled with dead silence and um/uh filler words against a tight, smooth AI jump-cut edited MP4 rendered locally in the browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="keepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">How AI Smart Jump-Cut Editing Tightens Talking-Head Videos</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Whisper AI + Gemini detect awkward pauses and filler words ("um", "uh"); FFmpeg WASM renders seamless cuts locally</text>

  <!-- Track 1: Raw Timeline -->
  <rect x="28" y="78" width="744" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.4"/>
  <text x="46" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BEFORE: RAW TALKING-HEAD RECORDING (4:00 — Awkward Pauses &amp; Fillers)</text>

  <!-- Timeline Segments -->
  <rect x="46" y="114" width="126" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="109" y="137" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Intro Hook</text>

  <rect x="178" y="114" width="76" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="216" y="137" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✕ "Um..."</text>

  <rect x="260" y="114" width="144" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="332" y="137" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Main Point #1</text>

  <rect x="410" y="114" width="96" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="458" y="137" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✕ 3.2s Silence</text>

  <rect x="512" y="114" width="124" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="574" y="137" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Key Demo</text>

  <rect x="642" y="114" width="66" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="675" y="137" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✕ "Uh.."</text>

  <rect x="714" y="114" width="42" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="735" y="137" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CTA</text>

  <!-- Track 2: Smooth Output -->
  <rect x="28" y="186" width="744" height="92" rx="12" fill="#0f172a" stroke="#065f46" stroke-width="1.6"/>
  <text x="46" y="208" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AFTER: SMOOTH AI JUMP-CUT EXPORT (3:22 — 38 Seconds of Dead Air Removed!)</text>

  <rect x="46" y="222" width="126" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="109" y="245" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Intro Hook</text>

  <rect x="176" y="222" width="144" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="248" y="245" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Main Point #1</text>

  <rect x="324" y="222" width="124" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="386" y="245" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Key Demo</text>

  <rect x="452" y="222" width="60" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="482" y="245" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CTA</text>

  <!-- Summary Pill -->
  <rect x="528" y="222" width="228" height="38" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="642" y="239" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ 30ms Audio Micro-Fades</text>
  <text x="642" y="253" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Click-free cuts • 0 Video Uploads</text>
</svg>
