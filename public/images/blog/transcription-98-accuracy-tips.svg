<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">4 Practical Steps to Reach 98 Percent Accuracy on Browser Audio Transcription</title>
  <desc id="desc">Four-step workflow for cleaner local Whisper transcripts: extract MP3 from huge 4K videos, check 10 seconds of audio clarity, select the exact spoken language explicitly, and do a 90-second timestamped proofread.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">How to Push Zoom Calls &amp; Phone Memos to 98%+ Accuracy</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Most transcription mistakes come from file bloat or Auto-language guesses — these 4 quick habits fix both</text>

  <!-- Step 1 -->
  <rect x="28" y="78" width="175" height="148" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="44" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STEP 01</text>
  <text x="44" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">4K Video → MP3</text>
  <text x="44" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Extract a lightweight</text>
  <text x="44" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">MP3 from 2GB camera</text>
  <text x="44" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">files to keep RAM low.</text>
  <text x="44" y="212" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Instant local load</text>

  <!-- Step 2 -->
  <rect x="217" y="78" width="175" height="148" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.4"/>
  <text x="233" y="104" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STEP 02</text>
  <text x="233" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">10-Sec Audio Check</text>
  <text x="233" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Confirm speech sits</text>
  <text x="233" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">clearly above room</text>
  <text x="233" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">hum &amp; close extra tabs.</text>
  <text x="233" y="212" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Smooth Web Worker</text>

  <!-- Step 3 -->
  <rect x="406" y="78" width="175" height="148" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
  <text x="422" y="104" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STEP 03</text>
  <text x="422" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Pick Exact Language</text>
  <text x="422" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Skip Auto-detect when</text>
  <text x="422" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">you know the language</text>
  <text x="422" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">(EN, UR, HI, AR, ES).</text>
  <text x="422" y="212" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Zero script drift</text>

  <!-- Step 4 -->
  <rect x="595" y="78" width="177" height="148" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="611" y="104" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STEP 04</text>
  <text x="611" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">90-Sec Proofread</text>
  <text x="611" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Toggle Timestamps On</text>
  <text x="611" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">to spot brand names &amp;</text>
  <text x="611" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">speaker turns fast.</text>
  <text x="611" y="212" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Ready for .TXT / SEO</text>
</svg>
