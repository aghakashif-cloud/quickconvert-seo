<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Two-Way 100% Private Browser Document Converter Hub</title>
  <desc id="desc">Client-side document conversion architecture converting PDF to Word DOCX, Excel XLSX, TXT, or PNG/JPG and back locally in browser RAM using PDF.js, docx, SheetJS, mammoth.js, and jsPDF with zero server uploads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Two-Way Private PDF ↔ Word, Excel &amp; Text Conversion</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Convert resumes, client reports, and spreadsheets inside temporary browser RAM — zero server uploads</text>

  <!-- Left: Source PDF -->
  <rect x="30" y="92" width="186" height="162" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="64" y="114" width="118" height="62" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="123" y="142" text-anchor="middle" fill="#fecaca" font-family="system-ui, sans-serif" font-size="15" font-weight="700">.PDF File</text>
  <text x="123" y="162" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5">Resume / Report</text>
  <text x="123" y="204" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Locked layout ready</text>
  <text x="123" y="222" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">for instant extraction</text>

  <!-- Two-Way Arrow Left -->
  <path d="M224 162 L268 162" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="268,156 278,162 268,168" fill="#38bdf8"/>
  <path d="M278 184 L234 184" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="234,178 224,184 234,190" fill="#34d399"/>

  <!-- Center: Local JS Engines -->
  <rect x="284" y="84" width="232" height="178" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.8"/>
  <rect x="284" y="84" width="232" height="36" rx="12" fill="url(#hub)"/>
  <text x="400" y="107" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">100% Local Browser RAM</text>
  <text x="302" y="144" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5">• PDF.js + docx engine</text>
  <text x="302" y="166" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5">• SheetJS (XLSX / CSV)</text>
  <text x="302" y="188" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5">• mammoth.js + jsPDF</text>
  <rect x="302" y="206" width="196" height="38" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="223" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔒 Zero Cloud Uploads</text>
  <text x="400" y="238" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">Finishes in 1–3 seconds</text>

  <!-- Two-Way Arrow Right -->
  <path d="M522 162 L566 162" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="566,156 576,162 566,168" fill="#38bdf8"/>
  <path d="M576 184 L532 184" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="532,178 522,184 532,190" fill="#34d399"/>

  <!-- Right: Editable Outputs -->
  <rect x="582" y="84" width="188" height="178" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="598" y="108" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">EDITABLE FORMATS</text>
  <rect x="598" y="120" width="156" height="30" rx="6" fill="#1e293b"/>
  <text x="676" y="139" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Word (.DOCX)</text>
  <rect x="598" y="158" width="156" height="30" rx="6" fill="#1e293b"/>
  <text x="676" y="177" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Excel (.XLSX / .CSV)</text>
  <rect x="598" y="196" width="156" height="30" rx="6" fill="#1e293b"/>
  <text x="676" y="215" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Plain Text / PNG / JPG</text>
  <text x="676" y="248" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Reverse DOCX → PDF too!</text>
</svg>
