<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="title desc">
  <title id="title">60-Second Self-Test to Verify Any Private File Converter</title>
  <desc id="desc">Three practical checks anyone can run to verify whether a converter is truly client-side: the Airplane Mode test, the F12 DevTools Network check, and watching large-file start speed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="248" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">60-Second DIY Audit: Prove a Converter Never Uploads Your Files</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Never trust a privacy badge blindly — run these three quick browser checks before converting sensitive documents</text>

  <!-- Check 1 -->
  <rect x="28" y="78" width="236" height="148" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.4"/>
  <rect x="44" y="94" width="78" height="22" rx="11" fill="#0c4a6e"/>
  <text x="83" y="109" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">CHECK 01</text>
  <text x="44" y="138" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Airplane Mode Test</text>
  <text x="44" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Load the page, turn off Wi-Fi,</text>
  <text x="44" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">then convert a sample photo.</text>
  <text x="44" y="206" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ True local tools still work offline</text>

  <!-- Check 2 -->
  <rect x="282" y="78" width="236" height="148" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.4"/>
  <rect x="298" y="94" width="78" height="22" rx="11" fill="#1e1b4b"/>
  <text x="337" y="109" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">CHECK 02</text>
  <text x="298" y="138" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">F12 Network Tab</text>
  <text x="298" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Press F12 → Network tab and</text>
  <text x="298" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">watch for outbound POST bytes.</text>
  <text x="298" y="206" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Zero file upload requests sent</text>

  <!-- Check 3 -->
  <rect x="536" y="78" width="236" height="148" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
  <rect x="552" y="94" width="78" height="22" rx="11" fill="#064e3b"/>
  <text x="591" y="109" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">CHECK 03</text>
  <text x="552" y="138" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Instant Large-File Start</text>
  <text x="552" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Drop a 150MB video. Cloud</text>
  <text x="552" y="177" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">sites stall at "Uploading 12%".</text>
  <text x="552" y="206" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ WASM begins converting instantly</text>
</svg>
