<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Merge Images into 1 Long JPG vs Multi-Page PDF Comparison</title>
  <desc id="desc">Side-by-side comparison showing when to stitch photos into a single scrolling JPG image versus combining scans into a multi-page PDF document.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="jpgAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pdfAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Choosing the Right Output: Stitched JPG vs. Multi-Page PDF</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Both formats run 100% locally in your browser via HTML5 Canvas &amp; pdf-lib — pick based on where the file is going</text>

  <!-- Left Panel: Merged JPG -->
  <rect x="28" y="78" width="362" height="196" rx="12" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
  <rect x="28" y="78" width="362" height="5" rx="2.5" fill="url(#jpgAccent)"/>
  <rect x="44" y="96" width="118" height="22" rx="11" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="103" y="111" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1 LONG JPG / PNG</text>
  <text x="172" y="112" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Seamless Scrolling Strip</text>

  <!-- Visual mini diagram: 3 stacked frames into 1 strip -->
  <rect x="46" y="132" width="66" height="122" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="52" y="138" width="54" height="32" rx="3" fill="#312e81"/>
  <text x="79" y="158" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Img 1</text>
  <rect x="52" y="176" width="54" height="32" rx="3" fill="#1e3a8a"/>
  <text x="79" y="196" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Img 2</text>
  <rect x="52" y="214" width="54" height="32" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="79" y="234" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Img 3</text>

  <!-- Bullet specs -->
  <text x="128" y="148" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Best For:</text>
  <text x="128" y="168" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Long WhatsApp / iMessage threads</text>
  <text x="128" y="187" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Side-by-side before &amp; after photos</text>
  <text x="128" y="206" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Social carousels &amp; recipe cards</text>
  <rect x="128" y="222" width="246" height="32" rx="6" fill="#1e293b"/>
  <text x="140" y="242" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Tip: Vertical or Horizontal stitch + 0px gap</text>

  <!-- Right Panel: Multi-Page PDF -->
  <rect x="410" y="78" width="362" height="196" rx="12" fill="#0f172a" stroke="#065f46" stroke-width="1.5"/>
  <rect x="410" y="78" width="362" height="5" rx="2.5" fill="url(#pdfAccent)"/>
  <rect x="426" y="96" width="128" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="490" y="111" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">MULTI-PAGE PDF</text>
  <text x="564" y="112" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Print-Ready Document</text>

  <!-- Visual mini diagram: 3 distinct pages -->
  <rect x="434" y="136" width="54" height="72" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="461" y="160" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Page 1</text>
  <rect x="442" y="170" width="38" height="4" rx="2" fill="#334155"/>
  <rect x="442" y="179" width="30" height="4" rx="2" fill="#334155"/>
  <rect x="442" y="188" width="34" height="4" rx="2" fill="#334155"/>

  <rect x="442" y="166" width="54" height="72" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="469" y="190" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Page 2</text>
  <rect x="450" y="200" width="38" height="4" rx="2" fill="#334155"/>
  <rect x="450" y="209" width="32" height="4" rx="2" fill="#334155"/>
  <rect x="450" y="218" width="36" height="4" rx="2" fill="#334155"/>

  <!-- Bullet specs -->
  <text x="514" y="148" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Best For:</text>
  <text x="514" y="168" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Front &amp; back ID / passport scans</text>
  <text x="514" y="187" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Multi-page homework &amp; expense bills</text>
  <text x="514" y="206" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• HR, visa, and university portals</text>
  <rect x="514" y="222" width="242" height="32" rx="6" fill="#1e293b"/>
  <text x="526" y="242" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Tip: Clean A4/Letter breaks, crisp print</text>
</svg>
