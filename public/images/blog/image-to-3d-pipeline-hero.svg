<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="Client-Side Image to 3D Pipeline: 2D Photo to Depth Anything AI Map to Interactive Three.js 3D Mesh">
  <rect width="800" height="310" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">100% CLIENT-SIDE 3D PIPELINE</text>
  <text x="36" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">How Depth Anything AI + Three.js Turn Any 2D Photo Into 3D</text>

  <!-- Step 1 -->
  <rect x="36" y="98" width="215" height="162" rx="14" fill="#111827" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="54" y="126" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">1. INPUT PHOTO</text>
  <text x="54" y="154" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Flat 2D Image</text>
  <text x="54" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">JPG, PNG, or WebP</text>
  <text x="54" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Stays strictly on device</text>
  <text x="54" y="236" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ZERO CLOUD UPLOADS</text>

  <path d="M259 179 L282 179" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="282,174 291,179 282,184" fill="#a855f7"/>

  <!-- Step 2 -->
  <rect x="294" y="98" width="215" height="162" rx="14" fill="#111827" stroke="#a855f7" stroke-opacity="0.55"/>
  <text x="312" y="126" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="800">2. AI DEPTH WORKER</text>
  <text x="312" y="154" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Depth Anything AI</text>
  <text x="312" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Brighter = Closer object</text>
  <text x="312" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Darker = Far background</text>
  <text x="312" y="236" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CACHED IN BROWSER</text>

  <path d="M517 179 L540 179" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="540,174 549,179 540,184" fill="#06b6d4"/>

  <!-- Step 3 -->
  <rect x="552" y="98" width="212" height="162" rx="14" fill="#111827" stroke="#06b6d4" stroke-opacity="0.55"/>
  <text x="570" y="126" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="800">3. THREE.JS WEBGL</text>
  <text x="570" y="154" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Interactive 3D Mesh</text>
  <text x="570" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Orbit, zoom &amp; adjust depth</text>
  <text x="570" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Export PNG or 5s WebM</text>
  <text x="570" y="236" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GPU ACCELERATED</text>
</svg>
