<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="title desc">
  <title id="title">The 3-Layer YouTube Tag System for Growing Channels</title>
  <desc id="desc">Structured 3-layer YouTube tag architecture fitting cleanly into 250 to 420 characters out of the 500-character limit: Layer 1 Exact Primary Keyword, Layer 2 6 to 10 Long-Tail Search Variations, and Layer 3 2 to 4 Broad Niche Context Tags.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">The 3-Layer YouTube Tag System (250–420 / 500 Chars)</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Replace vague 1-word tags like "tech" or "viral" with a structured stack that signals clear search intent</text>

  <!-- Layer 1 -->
  <rect x="30" y="78" width="740" height="58" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
  <text x="50" y="102" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LAYER 1: EXACT PRIMARY KEYWORD FIRST (1 Tag)</text>
  <text x="50" y="122" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="12">"how to convert mov to mp4 free" — matches your title &amp; opening description line</text>

  <!-- Layer 2 -->
  <rect x="30" y="148" width="740" height="58" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="172" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LAYER 2: SPECIFIC LONG-TAIL VARIATIONS (6–10 Tags)</text>
  <text x="50" y="192" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">"change mov file to mp4 on windows 11", "iphone video to mp4 without software", questions &amp; typos</text>

  <!-- Layer 3 -->
  <rect x="30" y="218" width="740" height="58" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="50" y="242" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LAYER 3: BROAD NICHE CONTEXT ANCHORS (2–4 Tags)</text>
  <text x="50" y="262" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">"video editing tips", "youtube creator workflow", "free browser tools" — defines channel neighborhood</text>
</svg>
