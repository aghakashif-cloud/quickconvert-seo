<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="title desc">
  <title id="title">AI Video Editor: Merge Multiple Clips &amp; Automatically Remove Silences and Filler Words</title>
  <desc id="desc">Timeline visualization showing multiple raw video clips merged locally into one timeline, with awkward silences and um/uh filler words stripped out into a smooth watermark-free MP4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="310" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="308" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">AI Video Editor: Merge Clips &amp; Auto-Remove Silences in Your Browser</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Upload 15–20+ raw clips • Auto-normalize &amp; merge • Cut dead air &amp; "um"/"uh" fillers • Zero watermarks</text>

  <!-- Track 1: Multiple Raw Clips -->
  <rect x="28" y="78" width="744" height="96" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.4"/>
  <text x="46" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BEFORE: MULTIPLE RAW CLIPS (.MOV + .MP4 — Pauses, Dead Air &amp; Fillers)</text>

  <rect x="46" y="116" width="122" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="107" y="134" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 1: Intro</text>
  <text x="107" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">iPhone .MOV</text>

  <rect x="174" y="116" width="74" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="211" y="140" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✕ "Um..."</text>

  <rect x="254" y="116" width="138" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="323" y="134" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 2: Main Tip</text>
  <text x="323" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Webcam .MP4</text>

  <rect x="398" y="116" width="96" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="446" y="140" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✕ 3.4s Silence</text>

  <rect x="500" y="116" width="124" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="562" y="134" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 3: Demo</text>
  <text x="562" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Screen .WebM</text>

  <rect x="630" y="116" width="66" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="663" y="140" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✕ "Uh.."</text>

  <rect x="702" y="116" width="54" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="729" y="140" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Clip 4</text>

  <!-- Track 2: Merged & Smooth Output -->
  <rect x="28" y="190" width="744" height="96" rx="12" fill="#0f172a" stroke="#065f46" stroke-width="1.6"/>
  <text x="46" y="212" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AFTER: 1 MERGED, SMOOTH AI-EDITED MP4 (54s of Dead Air &amp; Fillers Removed!)</text>

  <rect x="46" y="228" width="122" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="107" y="252" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 1: Intro</text>

  <rect x="172" y="228" width="138" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="241" y="252" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 2: Main Tip</text>

  <rect x="314" y="228" width="124" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="376" y="252" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 3: Demo</text>

  <rect x="442" y="228" width="66" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="475" y="252" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clip 4</text>

  <!-- Summary Pill -->
  <rect x="524" y="228" width="232" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="640" y="245" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ 30ms Click-Free Micro-Fades</text>
  <text x="640" y="260" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">100% Client-Side • 0 Video Uploads</text>
</svg>
