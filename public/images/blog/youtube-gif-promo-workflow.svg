<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="YouTube Tag Research to Looping GIF Promotion Workflow">
  <rect width="800" height="260" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <text x="36" y="42" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">10-MINUTE PRE-PUBLISH CREATOR WORKFLOW</text>
  <text x="36" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">From Competitor Tag Audit to Shareable Social GIF Loop</text>

  <rect x="36" y="96" width="218" height="126" rx="14" fill="#111827" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="54" y="124" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="800">1. AUDIT COMPETITORS</text>
  <text x="54" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">YouTube SEO Audit</text>
  <text x="54" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Extract hidden tags &amp; spot</text>
  <text x="54" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">recurring 2–5 word phrases</text>

  <path d="M262 159 L282 159" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="282,154 291,159 282,164" fill="#818cf8"/>

  <rect x="294" y="96" width="218" height="126" rx="14" fill="#111827" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="312" y="124" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">2. ALIGN PACKAGING</text>
  <text x="312" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Title + Description + Tags</text>
  <text x="312" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Match primary keyword in title</text>
  <text x="312" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">&amp; opening 2 description lines</text>

  <path d="M520 159 L540 159" stroke="#64748b" stroke-width="2.5"/>
